[project]
name = "mcp-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equipment_request"]

[tool.pytest.ini_options]
testpaths = ["tests"]
